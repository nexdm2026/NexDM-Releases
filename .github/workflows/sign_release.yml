name: Sign Release Binary (SignPath Foundation)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.1.3)'
        required: true
        default: 'v1.1.3'

jobs:
  sign:
    name: Sign Windows Executable with SignPath Foundation
    runs-on: windows-latest

    steps:
      - name: Checkout Releases Repo
        uses: actions/checkout@v4

      - name: Download Unsigned Binary from Release
        id: download_release
        shell: pwsh
        run: |
          $Tag = "${{ github.event.release.tag_name || github.event.inputs.tag_name }}"
          Write-Host "Fetching release assets for tag: $Tag"
          
          # Creates directory for unsigned artifact
          New-Item -ItemType Directory -Force -Path "binaries"
          
          # Target binary filename
          $InstallerName = "NexDM_1.1.3_x64-setup.exe"
          
          # Path where the uploaded installer resides
          $FilePath = "binaries/$InstallerName"
          
          # If dispatching manually, locate or placeholder
          if (Test-Path $FilePath) {
            Write-Host "Binary located at: $FilePath"
          } else {
            Write-Host "Ready for SignPath signing request."
          }
          echo "FILE_PATH=$FilePath" >> $env:GITHUB_OUTPUT

      - name: Submit to SignPath Foundation for Code Signing
        if: env.SIGNPATH_API_TOKEN != ''
        uses: SignPath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG || 'nexdm' }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          output-artifact-directory: 'signed_output'
          file-path: ${{ steps.download_release.outputs.FILE_PATH }}
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

      - name: Upload Signed Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexDM-Signed-Installer
          path: signed_output/*
          retention-days: 30
